<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Coloring Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h2>MARVEL COLORING ZONE</h2>
        
        <!-- Character Buttons -->
        <div class="character-select">
            <button id="spiderman" class="char-btn">🕷️ Spider-Man Outline</button>
            <button id="ironman" class="char-btn">🚀 Iron Man Outline</button>
        </div>

        <div class="toolbar">
            <!-- Colors -->
            <div class="color-palette">
                <div class="color-swatch" style="background: #ff0000;" data-color="#ff0000"></div>
                <div class="color-swatch" style="background: #0000ff;" data-color="#0000ff"></div>
                <div class="color-swatch" style="background: #ffff00;" data-color="#ffff00"></div>
                <div class="color-swatch" style="background: #000000;" data-color="#000000"></div>
                <div class="color-swatch" style="background: #008000;" data-color="#008000"></div>
                <input type="color" id="colorPicker" value="#ff0000">
            </div>

            <!-- Tools -->
            <div class="tools">
                <button id="eraser" class="tool-btn">🧽 Eraser</button>
                <button id="clear" class="tool-btn">🗑️ Clear All</button>
                <label>Size:</label>
                <input type="range" id="sizePicker" min="2" max="50" value="10">
            </div>
        </div>

        <!-- Drawing Area -->
        <div class="canvas-holder">
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
