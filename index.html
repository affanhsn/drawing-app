<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Drawing App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background-color: #222; color: white; font-family: Arial, sans-serif; overflow: hidden; }
        .controls { padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        button { padding: 10px 15px; cursor: pointer; background-color: #e23636; color: white; border: none; font-weight: bold; border-radius: 5px; text-transform: uppercase; }
        button:hover { background-color: #b31d1d; }
        #clear { background-color: #555; }
        canvas { background-color: white; border: 4px solid #444; cursor: crosshair; background-size: contain; background-repeat: no-repeat; background-position: center; touch-action: none; }
        h2 { margin: 5px; color: #f0131e; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <h2>MARVEL DRAW ZONE</h2>
    <div class="controls">
        <button id="spiderman">Spider-Man</button>
        <button id="ironman">Iron Man</button>
        <button id="clear">Clear All</button>
        <input type="color" id="colorPicker" value="#000000" title="Choose color">
        <input type="range" id="sizePicker" min="1" max="20" value="5" title="Brush size">
    </div>
    <canvas id="drawingCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
